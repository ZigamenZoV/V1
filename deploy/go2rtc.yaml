# go2rtc — RTSP-прослойка (спека §3): переподключения, fan-out одного потока
# нескольким потребителям, изоляция пайплайна от нестабильных камер.
# Скачать: https://github.com/AlexxIT/go2rtc/releases (go2rtc_win64.exe)
# Запуск:  go2rtc_win64.exe -config deploy/go2rtc.yaml
# Пайплайн подключается к rtsp://127.0.0.1:8554/<имя>, не к камерам напрямую.
streams:
  gate1: rtsp://user:pass@192.168.1.101:554/Streaming/Channels/101
  # gate2: rtsp://user:pass@192.168.1.102:554/Streaming/Channels/101
  # hall1: rtsp://user:pass@192.168.1.110:554/Streaming/Channels/101   # overview для аудита

rtsp:
  listen: "127.0.0.1:8554"

api:
  listen: "127.0.0.1:1984"     # веб-интерфейс go2rtc для проверки потоков

log:
  level: info
